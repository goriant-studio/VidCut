<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c7bff"/>
      <stop offset="100%" style="stop-color:#9b5cff"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)"/>
  <!-- Scissors blades -->
  <g fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round">
    <!-- Left blade -->
    <line x1="18" y1="20" x2="42" y2="44"/>
    <!-- Right blade -->
    <line x1="42" y1="20" x2="18" y2="44"/>
    <!-- Pivot dot -->
    <circle cx="30" cy="32" r="3" fill="#ffffff" stroke="none"/>
    <!-- Handles -->
    <circle cx="16" cy="18" r="5" stroke="#ffffff"/>
    <circle cx="44" cy="18" r="5" stroke="#ffffff"/>
  </g>
</svg>
