name: Windows Build (Rust)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build & Test (Windows MSVC)
    runs-on: windows-latest

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Rust toolchain ────────────────────────────────────────────────────────
      - name: Install Rust stable (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt

      # ── Caching ───────────────────────────────────────────────────────────────
      - name: Cache Cargo registry & build artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # ── Formatting ────────────────────────────────────────────────────────────
      - name: Check formatting
        run: cargo fmt --all -- --check

      # ── Clippy ────────────────────────────────────────────────────────────────
      - name: Clippy lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      # ── Build (Debug) ─────────────────────────────────────────────────────────
      - name: Build workspace (debug)
        run: cargo build --workspace

      # ── Tests ─────────────────────────────────────────────────────────────────
      - name: Run tests
        run: cargo test --workspace

      # ── Build (Release) ───────────────────────────────────────────────────────
      - name: Build workspace (release)
        run: cargo build --workspace --release

      # ── Upload artefact ───────────────────────────────────────────────────────
      - name: Upload vidcut.exe
        uses: actions/upload-artifact@v4
        with:
          name: vidcut-windows-x64
          path: target/release/vidcut.exe
          if-no-files-found: error
