# ── Platform-specific build configuration ─────────────────────────────────────
# No default target is set so cargo builds for the host platform.
# To cross-compile for Windows, pass `--target x86_64-pc-windows-gnu` explicitly.

# Move build artefacts outside the project tree.
# This avoids Windows Application Control (WDAC/AppLocker) policies that can
# block build-script executables generated inside the project directory.
# Override with CARGO_TARGET_DIR env-var if you need a different location.
[build]
target-dir = "C:\\CargoTargets\\VidCut"

[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "target-cpu=native"]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-cpu=native"]
