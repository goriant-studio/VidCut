[workspace]
resolver = "2"
members = [
    "crates/vidcut-app",
    "crates/vidcut-core",
    "crates/vidcut-media",
]

[workspace.dependencies]
# UI
eframe          = { version = "0.30", features = ["wgpu"] }
egui            = "0.30"
egui_extras     = "0.30"

# Async
tokio           = { version = "1", features = ["full"] }

# File dialogs (native OS dialog, no C deps)
rfd             = "0.15"

# Pure-Rust media probing — no C library deps
mp4             = "0.14"
symphonia       = { version = "0.5", features = ["all"] }

# FFmpeg sidecar — manages ffmpeg CLI binary download
ffmpeg-sidecar  = "2"

# Windows native
windows         = { version = "0.58", features = [
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dxgi",
    "Win32_System_Com",
] }

# Serialization / utils
serde           = { version = "1", features = ["derive"] }
serde_json      = "1"
thiserror       = "1"
anyhow          = "1"
tracing         = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot     = "0.12"
uuid            = { version = "1", features = ["v4", "serde"] }

[profile.release]
opt-level       = 3
lto             = "thin"
codegen-units   = 1
strip           = true
